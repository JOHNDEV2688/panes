<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buen Pan</title>
    <link rel="icon" href="assets/img/icon.png">
    <link rel="stylesheet" href="practica-div-class.css">
</head>

<body>
    <header>
        <h1>Buen Pan</h1>

        <figure>
            <img src="assets/img/icon.png" alt="logo buen pan">
            <figcaption>El mejor Pan</figcaption>
        </figure>

        <nav>
            <ul>
                <a href="#">Inicio</a>
                <a href="#">Productos</a>
                <a href="#">Contacto</a>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Bienvenidos a Buen Pan</h2>

            <p>El pan más fresco en tu mesa</p>

            <figure>
                <img src="assets/img/icon.png" alt="logo buen pan">
                <figcaption>Pan recien horneado</figcaption>
            </figure>

            <div class="productos">
                
                
                <article class="destacado">
                    <h3>Pan de maíz</h3>
                    <p>Delicioso pan de maíz suave y esponjoso</p>
                    <figure>
                        <img src="assets/img/pan_maiz.webp" alt="pan de pan maiz">
                        <figcaption>Pan de maíz sacado del horno</figcaption>
                    </figure>
                </article>

                <article>
                    <h3>Pan campesino</h3>
                    <p>Rico pan campesino, el tradicional de los abuelos</p>
                    <figure>
                        <img src="assets/img/pan_campesino.webp" alt="Pan campesino">
                        <figcaption>Pan campesino en tu mesa</figcaption>
                    </figure>
                </article>

                <article>
                    <h3>Pan de chocolate</h3>
                    <p>El mejor pan con chocolate</p>
                    <figure>
                        <img src="assets/img/pan_chocolate.jpg" alt="pan de chocolate">
                        <figcaption>Pan de chocolate dulce y fresco</figcaption>
                    </figure>
                </article>

            </div>
        </section>
    </main>
</body>
</html>
